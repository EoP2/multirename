name: Build MultiRename

on:
  workflow_dispatch:

jobs:

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lazarus
        uses: doublecmd/lazarus-install@win
        with:
          lazarus-version: "stable"

      - name: Compile manifest resource
        shell: bash
        run: windres multirename.rc -O coff -o multirename.res
        
      - name: Install DC packages
        run: |
          lazbuild src\vendor\doublecmd\doublecmd_common.lpk
          lazbuild src\vendor\KASToolBar\kascomp.lpk

      - name: Build
        run: lazbuild multirename.lpi --bm=Release --widgetset=win32

      - uses: actions/upload-artifact@v4
        with:
          name: multirename-windows-x64
          path: multirename.exe

  build-linux:
    name: Linux x86_64 (GTK2)
    # ubuntu-22.04 apt 源自带 Lazarus 2.2.0，其 TCustomSpeedButton 还没有 Alignment 属性，
    # 而 doublecmd master 分支的 KASToolBar/kastoolbar.pas 已经在用 Self.Alignment，
    # 编译到这里会报 "identifier idents no member Alignment"。
    # ubuntu-24.04 apt 自带 Lazarus 3.0，已包含该属性，故升级运行环境。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lazarus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lazarus libgtk2.0-dev libglib2.0-dev

      - name: Install DC packages
        run: |
          lazbuild src/vendor/doublecmd/doublecmd_common.lpk
          lazbuild src/vendor/KASToolBar/kascomp.lpk

      - name: Build
        run: lazbuild multirename.lpi --bm=Release --widgetset=gtk2

      - uses: actions/upload-artifact@v4
        with:
          name: multirename-linux-x64
          path: multirename

  build-macos:
    name: macOS x86_64 (Cocoa)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Lazarus
        run: brew install fpc lazarus

      - name: Install DC packages
        run: |
          lazbuild src/vendor/doublecmd/doublecmd_common.lpk
          lazbuild src/vendor/KASToolBar/kascomp.lpk

      - name: Build
        run: lazbuild multirename.lpi --bm=Release --widgetset=cocoa

      - uses: actions/upload-artifact@v4
        with:
          name: multirename-macos-x64
          path: multirename

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Package
        run: |
          zip multirename-windows-x64.zip  multirename-windows-x64/multirename.exe
          tar czf multirename-linux-x64.tar.gz multirename-linux-x64/multirename
          zip multirename-macos-x64.zip    multirename-macos-x64/multirename

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            multirename-windows-x64.zip
            multirename-linux-x64.tar.gz
            multirename-macos-x64.zip
          generate_release_notes: true
